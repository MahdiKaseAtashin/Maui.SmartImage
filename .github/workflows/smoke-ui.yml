name: UI Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: '10.0.x'
  APPIUM_PORT: '4723'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Enable Developer Mode (WinAppDriver)
        shell: pwsh
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Install WinAppDriver
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\WinAppDriver.msi"
          Invoke-WebRequest -Uri "https://github.com/microsoft/WinAppDriver/releases/download/v1.2.1/WindowsApplicationDriver_1.2.1.msi" -OutFile $msi
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn /norestart"
          $wad = "${env:ProgramFiles(x86)}\Windows Application Driver\WinAppDriver.exe"
          if (-not (Test-Path $wad)) { throw "WinAppDriver not installed at $wad" }
          # Keep WinAppDriver off 4723 so Appium can bind there.
          Start-Process -FilePath $wad -ArgumentList "4724" -WindowStyle Hidden
          Start-Sleep -Seconds 3

      - name: Install Appium + Windows driver
        shell: pwsh
        run: |
          npm install -g appium
          appium driver install windows
          $appiumCmd = (Get-Command appium.cmd).Source
          Start-Process -FilePath $appiumCmd -ArgumentList "--port",$env:APPIUM_PORT,"--log","$PWD\appium-windows.log","--log-level","info" -WindowStyle Hidden
          $deadline = (Get-Date).AddMinutes(2)
          do {
            try {
              $client = New-Object System.Net.Sockets.TcpClient
              $client.Connect("127.0.0.1", [int]$env:APPIUM_PORT)
              $client.Close()
              Write-Host "Appium is listening on $($env:APPIUM_PORT)"
              break
            } catch {
              if ((Get-Date) -gt $deadline) { throw "Appium did not open port $($env:APPIUM_PORT)" }
              Start-Sleep -Seconds 2
            }
          } while ($true)

      - name: Publish sample (Windows smoke)
        shell: pwsh
        run: |
          # Avoid `-r win-x64` — it pulls a missing Mono.win-x64 runtime pack.
          dotnet publish samples/Maui.SmartImage.Sample/Maui.SmartImage.Sample.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -p:SMARTIMAGE_SMOKE=true `
            -p:WindowsPackageType=None `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:UseMonoRuntime=false `
            -o artifacts/windows-app

      - name: Run Windows UI smoke
        shell: pwsh
        env:
          WINDOWS_APP_PATH: ${{ github.workspace }}\artifacts\windows-app\Maui.SmartImage.Sample.exe
          WINAPPDRIVER_URL: http://127.0.0.1:4724
        run: |
          if (-not (Test-Path $env:WINDOWS_APP_PATH)) {
            Get-ChildItem -Recurse artifacts/windows-app | Select-Object -First 50 FullName
            throw "WINDOWS_APP_PATH not found: $env:WINDOWS_APP_PATH"
          }
          dotnet test tests/UITests/UITests.Windows/UITests.Windows.csproj -c Release --logger "trx;LogFileName=windows-smoke.trx"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: |
            appium-windows.log
            appium-local.log
            **/TestResults/*.trx
          if-no-files-found: ignore

  android:
    # Linux + KVM is far more reliable for x86_64 emulators than Apple Silicon hosts.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Install Appium + UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Publish sample (Android smoke)
        run: |
          dotnet publish samples/Maui.SmartImage.Sample/Maui.SmartImage.Sample.csproj \
            -c Release \
            -f net10.0-android \
            -r android-x64 \
            -p:SMARTIMAGE_SMOKE=true \
            -p:TargetFrameworks=net10.0-android \
            -p:AndroidPackageFormats=apk

      - name: Locate APK
        id: apk
        run: |
          APK=$(find "$GITHUB_WORKSPACE/samples/Maui.SmartImage.Sample/bin" -name '*-Signed.apk' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find "$GITHUB_WORKSPACE/samples/Maui.SmartImage.Sample/bin" -name '*.apk' | head -n 1)
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          test -n "$APK"

      - name: Run Android emulator + UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            appium --port ${{ env.APPIUM_PORT }} --log "$GITHUB_WORKSPACE/appium-android.log" --log-level info &
            sleep 10
            export ANDROID_APP_PATH="${{ steps.apk.outputs.path }}"
            echo "ANDROID_APP_PATH=$ANDROID_APP_PATH"
            adb install -r "$ANDROID_APP_PATH"
            dotnet test tests/UITests/UITests.Android/UITests.Android.csproj -c Release --logger "trx;LogFileName=android-smoke.trx"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android
          path: |
            appium-android.log
            appium-local.log
            **/TestResults/*.trx
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Microsoft.iOS 26.0.x requires Xcode 26.0 (not 26.1.x).
          xcode-version: '26.0'

      - name: Ensure iOS platform / simulator runtime
        run: |
          xcrun simctl list > /dev/null || true
          xcodebuild -downloadPlatform iOS -architectureVariant universal || xcodebuild -downloadPlatform iOS

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Install Appium + XCUITest
        run: |
          npm install -g appium
          appium driver install xcuitest

      # iOS simulator cannot use `dotnet publish` (device RID required). Build the .app instead.
      - name: Build sample (iOS simulator smoke)
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then RID=iossimulator-arm64; else RID=iossimulator-x64; fi
          echo "RID=$RID"
          dotnet build samples/Maui.SmartImage.Sample/Maui.SmartImage.Sample.csproj \
            -c Release \
            -f net10.0-ios \
            -r "$RID" \
            -p:SMARTIMAGE_SMOKE=true \
            -p:TargetFrameworks=net10.0-ios \
            -p:_RequireCodeSigning=false

      - name: Locate .app
        id: app
        run: |
          APP=$(find "$GITHUB_WORKSPACE/samples/Maui.SmartImage.Sample/bin" -type d -name '*.app' | head -n 1)
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP"
          test -n "$APP" && test -d "$APP"

      - name: Resolve iOS simulator device
        id: sim
        run: |
          # Emit a clean device name only (no UDID / parentheses).
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [^(:]+' | head -n 1 | sed 's/[[:space:]]*$//')
          if [ -z "$NAME" ]; then NAME="iPhone 16"; fi
          echo "device=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"
          xcrun simctl list devices available | head -n 40

      - name: Start Appium
        run: |
          appium --port ${{ env.APPIUM_PORT }} --log "$GITHUB_WORKSPACE/appium-ios.log" --log-level info &
          sleep 10

      - name: Run iOS UI smoke
        env:
          IOS_APP_PATH: ${{ steps.app.outputs.path }}
          IOS_DEVICE_NAME: ${{ steps.sim.outputs.device }}
        run: |
          dotnet test tests/UITests/UITests.iOS/UITests.iOS.csproj -c Release --logger "trx;LogFileName=ios-smoke.trx"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ios
          path: |
            appium-ios.log
            appium-local.log
            **/TestResults/*.trx
          if-no-files-found: ignore

  maccatalyst:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Install Appium + Mac2
        run: |
          npm install -g appium
          appium driver install mac2

      # Prefer build over publish so the .app bundle is produced reliably for Mac2.
      - name: Build sample (MacCatalyst smoke)
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then RID=maccatalyst-arm64; else RID=maccatalyst-x64; fi
          echo "RID=$RID"
          dotnet build samples/Maui.SmartImage.Sample/Maui.SmartImage.Sample.csproj \
            -c Release \
            -f net10.0-maccatalyst \
            -r "$RID" \
            -p:SMARTIMAGE_SMOKE=true \
            -p:TargetFrameworks=net10.0-maccatalyst

      - name: Locate .app
        id: app
        run: |
          # ApplicationTitle is "SmartImage.Maui Sample" → bundle is "SmartImage.Maui Sample.app"
          APP=$(find "$GITHUB_WORKSPACE/samples/Maui.SmartImage.Sample/bin" -type d -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "No .app found; listing bin tree:"
            find "$GITHUB_WORKSPACE/samples/Maui.SmartImage.Sample/bin" -maxdepth 6 -print | head -n 200
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP"
          test -n "$APP" && test -d "$APP"

      - name: Start Appium
        run: |
          appium --port ${{ env.APPIUM_PORT }} --log "$GITHUB_WORKSPACE/appium-maccatalyst.log" --log-level info &
          sleep 10

      - name: Run MacCatalyst UI smoke
        env:
          MACCATALYST_APP_PATH: ${{ steps.app.outputs.path }}
        run: |
          dotnet test tests/UITests/UITests.MacCatalyst/UITests.MacCatalyst.csproj -c Release --logger "trx;LogFileName=maccatalyst-smoke.trx"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-maccatalyst
          path: |
            appium-maccatalyst.log
            appium-local.log
            **/TestResults/*.trx
          if-no-files-found: ignore
