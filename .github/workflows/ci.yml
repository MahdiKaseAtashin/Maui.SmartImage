name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      # Build library + tests only. The sample targets ios/maccatalyst/windows and
      # fails restore/RID resolution on CI runners when building the full solution.
      - name: Restore
        run: |
          dotnet restore Maui.SmartImage/Maui.SmartImage.csproj
          dotnet restore tests/Maui.SmartImage.Tests/Maui.SmartImage.Tests.csproj

      - name: Build
        run: |
          dotnet build Maui.SmartImage/Maui.SmartImage.csproj -c Release --no-restore
          dotnet build tests/Maui.SmartImage.Tests/Maui.SmartImage.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Maui.SmartImage.Tests/Maui.SmartImage.Tests.csproj -c Release --no-build --verbosity normal

      # Compile the sample for Windows only — catches XAML/API breakages without devices.
      # Full multi-TFM restore of the sample still fails on CI (ios/maccatalyst RIDs).
      # Sample restore with -r can rewrite the library assets file, so re-restore the library after.
      - name: Build sample (Windows)
        run: |
          dotnet restore samples/Maui.SmartImage.Sample/Maui.SmartImage.Sample.csproj -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64
          dotnet restore Maui.SmartImage/Maui.SmartImage.csproj
          dotnet build samples/Maui.SmartImage.Sample/Maui.SmartImage.Sample.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --no-restore
