name: CI

on:
  push:
    branches: [main, master, 'final/**']
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore
        run: dotnet restore Maui.SmartImage.sln

      - name: Build
        run: dotnet build Maui.SmartImage.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Maui.SmartImage.Tests/Maui.SmartImage.Tests.csproj -c Release --no-build --verbosity normal
