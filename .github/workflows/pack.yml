name: Pack

on:
  push:
    tags:
      - 'v*'

jobs:
  pack:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Pack
        env:
          CI: true
        run: dotnet pack Maui.SmartImage/Maui.SmartImage.csproj -c Release -o artifacts -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          # Must match nuget.org profile username AND Trusted Publishing "Package Owner"
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $key = "${{ steps.login.outputs.NUGET_API_KEY }}"
          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "NuGet login did not return an API key. Check NUGET_USER secret and Trusted Publishing policy."
          }

          $packages = @(Get-ChildItem artifacts -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in artifacts/."
          }

          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName `
              --api-key $key `
              --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $($pkg.Name) with exit code $LASTEXITCODE"
            }
          }

          Write-Host "Push completed. Package may take a few minutes to appear on nuget.org."
